services:
  postgres:
    image: postgres:16
    container_name: rackpay-postgres-test
    environment:
      POSTGRES_DB: rackpay
      POSTGRES_USER: rackpay
      POSTGRES_PASSWORD: rackpay
    ports:
      - "5432:5432"
    volumes:
      - rackpay-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rackpay -d rackpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: rackpay-keycloak-test
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rackpay-postgres-test-data:

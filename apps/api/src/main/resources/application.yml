spring:
  application:
    name: rackpay-api

  datasource:
    url: ${RACKPAY_DATABASE_URL:jdbc:postgresql://localhost:5432/rackpay}
    username: ${RACKPAY_DATABASE_USERNAME:rackpay}
    password: ${RACKPAY_DATABASE_PASSWORD:rackpay}
    hikari:
      maximum-pool-size: ${RACKPAY_DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: RackPay Financial Core
    version: 0.1.0

name: Package refactor verification

on:
  push:
    branches:
      - refactor/feature-package-architecture

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test API
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew -p apps/api test
          else
            gradle -p apps/api test
          fi

name: Refactor feature packages

on:
  push:
    branches:
      - refactor/feature-package-architecture

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[package-refactor]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/feature-package-architecture

      - name: Refactor Java package architecture
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path("apps/api/src/main/java/com/rackpay/api")

          exact = {
            "auth/AdminUserController.java": "auth/adapters/in/web/AdminUserController.java",
            "auth/AdminUserService.java": "auth/core/service/AdminUserService.java",
            "auth/AuthController.java": "auth/adapters/in/web/AuthController.java",
            "auth/AuthExceptionHandler.java": "auth/adapters/in/web/AuthExceptionHandler.java",
            "auth/AuthenticatedUserController.java": "auth/adapters/in/web/AuthenticatedUserController.java",
            "auth/BootstrapAdminInitializer.java": "auth/adapters/out/keycloak/BootstrapAdminInitializer.java",
            "auth/BootstrapAdminProperties.java": "auth/adapters/out/keycloak/BootstrapAdminProperties.java",
            "auth/KeycloakAdminClient.java": "auth/adapters/out/keycloak/KeycloakAdminClient.java",
            "auth/KeycloakAdminProperties.java": "auth/adapters/out/keycloak/KeycloakAdminProperties.java",
            "auth/RegistrationException.java": "auth/core/exception/RegistrationException.java",
            "auth/RegistrationRequest.java": "auth/adapters/in/web/RegistrationRequest.java",
            "auth/RegistrationResponse.java": "auth/adapters/in/web/RegistrationResponse.java",
            "auth/RegistrationService.java": "auth/core/service/RegistrationService.java",

            "config/KeycloakConfig.java": "shared/configuration/KeycloakConfig.java",
            "config/SchedulingConfig.java": "shared/configuration/SchedulingConfig.java",
            "config/SecurityConfig.java": "shared/configuration/SecurityConfig.java",

            "domain/ledger/EntryDirection.java": "ledger/core/model/EntryDirection.java",
            "domain/ledger/LedgerAccount.java": "ledger/core/model/LedgerAccount.java",
            "domain/ledger/LedgerAccountId.java": "ledger/core/model/LedgerAccountId.java",
            "domain/ledger/LedgerAccountType.java": "ledger/core/model/LedgerAccountType.java",
            "domain/ledger/LedgerEntry.java": "ledger/core/model/LedgerEntry.java",
            "domain/ledger/LedgerTransaction.java": "ledger/core/model/LedgerTransaction.java",
            "domain/money/Currency.java": "shared/core/money/Currency.java",
            "domain/money/Money.java": "shared/core/money/Money.java",
            "domain/transaction/FinancialTransaction.java": "shared/core/transaction/FinancialTransaction.java",
            "domain/transaction/IdempotencyKey.java": "shared/core/transaction/IdempotencyKey.java",
            "domain/transaction/TransactionId.java": "shared/core/transaction/TransactionId.java",
            "domain/transaction/TransactionStatus.java": "shared/core/transaction/TransactionStatus.java",
            "domain/wallet/Wallet.java": "wallet/core/model/Wallet.java",
            "domain/wallet/WalletId.java": "wallet/core/model/WalletId.java",

            "health/HealthController.java": "shared/adapters/in/web/HealthController.java",

            "payment/MolliePaymentProvider.java": "payment/adapters/out/providers/mollie/MolliePaymentProvider.java",
            "payment/PaymentController.java": "payment/adapters/in/web/PaymentController.java",
            "payment/PaymentProvider.java": "payment/ports/out/PaymentProvider.java",
            "payment/PaymentProviderAdminController.java": "payment/adapters/in/web/PaymentProviderAdminController.java",
            "payment/PaymentProviderRegistry.java": "payment/core/service/PaymentProviderRegistry.java",
            "payment/PaymentProviderType.java": "payment/core/model/PaymentProviderType.java",
            "payment/PaymentWebhookController.java": "payment/adapters/in/web/PaymentWebhookController.java",
            "payment/StripePaymentProvider.java": "payment/adapters/out/providers/stripe/StripePaymentProvider.java",

            "security/PlatformAdminAuthorizationManager.java": "auth/adapters/in/security/PlatformAdminAuthorizationManager.java",

            "remittance/ConfiguredFxRateProvider.java": "remittance/adapters/out/providers/fx/ConfiguredFxRateProvider.java",
            "remittance/FlutterwavePayoutProvider.java": "remittance/adapters/out/providers/flutterwave/FlutterwavePayoutProvider.java",
            "remittance/FxRateProvider.java": "remittance/ports/out/FxRateProvider.java",
            "remittance/MobileMoneyNetwork.java": "remittance/core/model/MobileMoneyNetwork.java",
            "remittance/PayoutMethod.java": "remittance/core/model/PayoutMethod.java",
            "remittance/PayoutProvider.java": "remittance/ports/out/PayoutProvider.java",
            "remittance/PayoutProviderRegistry.java": "remittance/core/service/PayoutProviderRegistry.java",
            "remittance/PayoutProviderType.java": "remittance/core/model/PayoutProviderType.java",
            "remittance/PaystackPayoutProvider.java": "remittance/adapters/out/providers/paystack/PaystackPayoutProvider.java",
            "remittance/PhoneNumberNormalizer.java": "remittance/core/service/PhoneNumberNormalizer.java",
            "remittance/PreparedPayout.java": "remittance/core/model/PreparedPayout.java",
            "remittance/PreparedPayoutMapper.java": "remittance/adapters/out/providers/PreparedPayoutMapper.java",
            "remittance/RemittanceClearingAccountService.java": "remittance/core/service/RemittanceClearingAccountService.java",
            "remittance/RemittanceFundingController.java": "remittance/adapters/in/web/RemittanceFundingController.java",
            "remittance/RemittanceFundingService.java": "remittance/core/service/RemittanceFundingService.java",
            "remittance/RemittanceHistoryController.java": "remittance/adapters/in/web/RemittanceHistoryController.java",
            "remittance/RemittanceHistoryService.java": "remittance/core/service/RemittanceHistoryService.java",
            "remittance/RemittancePayoutController.java": "remittance/adapters/in/web/RemittancePayoutController.java",
            "remittance/RemittancePayoutLedgerService.java": "remittance/core/service/RemittancePayoutLedgerService.java",
            "remittance/RemittancePayoutRecoveryService.java": "remittance/core/service/RemittancePayoutRecoveryService.java",
            "remittance/RemittancePayoutService.java": "remittance/core/service/RemittancePayoutService.java",
            "remittance/RemittanceQuoteController.java": "remittance/adapters/in/web/RemittanceQuoteController.java",
            "remittance/RemittanceQuoteService.java": "remittance/core/service/RemittanceQuoteService.java",
            "remittance/RemittanceRecipientController.java": "remittance/adapters/in/web/RemittanceRecipientController.java",
            "remittance/RemittanceRecipientVerificationService.java": "remittance/core/service/RemittanceRecipientVerificationService.java",

            "wallet/OpenWalletBalanceRequest.java": "wallet/adapters/in/web/OpenWalletBalanceRequest.java",
            "wallet/WalletBalanceResponse.java": "wallet/adapters/in/web/WalletBalanceResponse.java",
            "wallet/WalletController.java": "wallet/adapters/in/web/WalletController.java",
            "wallet/WalletResponse.java": "wallet/adapters/in/web/WalletResponse.java",
            "wallet/WalletTransactionController.java": "wallet/adapters/in/web/WalletTransactionController.java",
            "wallet/WalletTransactionResponse.java": "wallet/adapters/in/web/WalletTransactionResponse.java",

            "service/FinancialTransactionService.java": "shared/core/service/FinancialTransactionService.java",
            "service/InsufficientWalletFundsException.java": "wallet/core/exception/InsufficientWalletFundsException.java",
            "service/PaymentAdjustmentService.java": "payment/core/service/PaymentAdjustmentService.java",
            "service/PaymentProviderService.java": "payment/core/service/PaymentProviderService.java",
            "service/PaymentService.java": "payment/core/service/PaymentService.java",
            "service/PaymentSettlementAccountService.java": "payment/core/service/PaymentSettlementAccountService.java",
            "service/PaymentWebhookService.java": "payment/core/service/PaymentWebhookService.java",
            "service/WalletBalanceService.java": "wallet/core/service/WalletBalanceService.java",
            "service/WalletCreditService.java": "wallet/core/service/WalletCreditService.java",
            "service/WalletDebitService.java": "wallet/core/service/WalletDebitService.java",
            "service/WalletFinancialOperationService.java": "wallet/core/service/WalletFinancialOperationService.java",
            "service/WalletLedgerService.java": "wallet/core/service/WalletLedgerService.java",
          }

          old_base = "com.rackpay.api."
          class_pkg = {}

          for old_rel, new_rel in exact.items():
              old_name = Path(old_rel).stem
              new_pkg = old_base + str(Path(new_rel).parent).replace("/", ".")
              old_pkg = old_base + str(Path(old_rel).parent).replace("/", ".")
              class_pkg[old_pkg + "." + old_name] = new_pkg + "." + old_name

          # Persistence is feature-owned infrastructure.
          for p in (root / "persistence").rglob("*.java") if (root / "persistence").exists() else []:
              rel = p.relative_to(root).as_posix()
              parts = rel.split("/")
              feature = parts[1]
              target = f"{feature}/adapters/out/persistence/{parts[-1]}"
              exact[rel] = target

          # Persistence package mapping.
          for old_rel, new_rel in list(exact.items()):
              if old_rel.startswith("persistence/"):
                  old_pkg = old_base + str(Path(old_rel).parent).replace("/", ".")
                  new_pkg = old_base + str(Path(new_rel).parent).replace("/", ".")
                  class_pkg[old_pkg + "." + Path(old_rel).stem] = new_pkg + "." + Path(old_rel).stem

          # Move all explicitly mapped files.
          for old_rel, new_rel in exact.items():
              src = root / old_rel
              dst = root / new_rel
              if src.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(src, dst)

          # Update package declarations and every internal fully-qualified reference/import.
          java_files = list(root.rglob("*.java"))
          for p in java_files:
              rel = p.relative_to(root).as_posix()
              parent = str(p.relative_to(root).parent).replace("/", ".")
              pkg = "com.rackpay.api" if parent == "." else old_base + parent
              text = p.read_text()
              text = re.sub(r"^package\s+[^;]+;", f"package {pkg};", text, count=1, flags=re.M)
              for old_fqcn, new_fqcn in sorted(class_pkg.items(), key=lambda x: -len(x[0])):
                  text = text.replace(old_fqcn, new_fqcn)
              # Update package prefixes for old package groups.
              prefixes = {
                  "com.rackpay.api.config": "com.rackpay.api.shared.configuration",
                  "com.rackpay.api.domain.ledger": "com.rackpay.api.ledger.core.model",
                  "com.rackpay.api.domain.money": "com.rackpay.api.shared.core.money",
                  "com.rackpay.api.domain.transaction": "com.rackpay.api.shared.core.transaction",
                  "com.rackpay.api.domain.wallet": "com.rackpay.api.wallet.core.model",
                  "com.rackpay.api.health": "com.rackpay.api.shared.adapters.in.web",
                  "com.rackpay.api.persistence.admin": "com.rackpay.api.auth.adapters.out.persistence",
                  "com.rackpay.api.persistence.ledger": "com.rackpay.api.ledger.adapters.out.persistence",
                  "com.rackpay.api.persistence.payment": "com.rackpay.api.payment.adapters.out.persistence",
                  "com.rackpay.api.persistence.remittance": "com.rackpay.api.remittance.adapters.out.persistence",
                  "com.rackpay.api.persistence.transaction": "com.rackpay.api.shared.adapters.out.persistence",
                  "com.rackpay.api.persistence.user": "com.rackpay.api.auth.adapters.out.persistence",
                  "com.rackpay.api.persistence.wallet": "com.rackpay.api.wallet.adapters.out.persistence",
              }
              for old_prefix, new_prefix in prefixes.items():
                  text = text.replace(old_prefix, new_prefix)

              # Files that used to share a package no longer get implicit same-package visibility.
              # Add explicit imports for moved RackPay types referenced by simple class name.
              current_pkg = pkg
              imports = []
              for old_fqcn, new_fqcn in class_pkg.items():
                  simple = old_fqcn.rsplit(".", 1)[-1]
                  target_pkg = new_fqcn.rsplit(".", 1)[0]
                  if target_pkg != current_pkg and re.search(r"\b" + re.escape(simple) + r"\b", text):
                      if f"import {new_fqcn};" not in text and not re.search(r"\\b(?:class|interface|enum|record)\\s+" + re.escape(simple) + r"\b", text):
                          imports.append(f"import {new_fqcn};")
              if imports:
                  package_match = re.search(r"^package\\s+[^;]+;\\n", text, re.M)
                  if package_match:
                      text = text[:package_match.end()] + "\n" + "\\n".join(sorted(set(imports))) + "\n" + text[package_match.end():]

              p.write_text(text)

          # Mirror test packages with the refactored feature boundaries.
          test_root = Path("apps/api/src/test/java/com/rackpay/api")
          test_map = {
              "auth": "auth",
              "domain/ledger": "ledger/core/model",
              "domain/money": "shared/core/money",
              "domain/transaction": "shared/core/transaction",
              "domain/wallet": "wallet/core/model",
              "persistence/admin": "auth/adapters/out/persistence",
              "persistence/remittance": "remittance/adapters/out/persistence",
              "remittance": "remittance",
              "security": "auth/adapters/in/security",
              "service": "shared/core/service",
          }
          if test_root.exists():
              for src in list(test_root.rglob("*.java")):
                  rel = src.relative_to(test_root).as_posix()
                  target_dir = None
                  for old_dir, new_dir in test_map.items():
                      if rel.startswith(old_dir + "/"):
                          target_dir = new_dir
                          break
                  if target_dir is not None:
                      dst = test_root / target_dir / src.name
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.move(src, dst)

              for p in test_root.rglob("*.java"):
                  rel = p.relative_to(test_root)
                  parent = str(rel.parent).replace("/", ".")
                  pkg = "com.rackpay.api" if parent == "." else "com.rackpay.api." + parent
                  text = p.read_text()
                  text = re.sub(r"^package\s+[^;]+;", f"package {pkg};", text, count=1, flags=re.M)
                  for old_fqcn, new_fqcn in sorted(class_pkg.items(), key=lambda x: -len(x[0])):
                      text = text.replace(old_fqcn, new_fqcn)
                  for old_prefix, new_prefix in prefixes.items():
                      text = text.replace(old_prefix, new_prefix)
                  p.write_text(text)

          # Remove now-empty legacy directories.
          for d in ["auth","config","domain","health","payment","persistence","remittance","security","service","wallet"]:
              dpath = root / d
              if dpath.exists():
                  for child in sorted(dpath.rglob("*"), reverse=True):
                      if child.is_dir():
                          try: child.rmdir()
                          except OSError: pass
                  try: dpath.rmdir()
                  except OSError: pass
          PY

      - name: Verify
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew -p apps/api test
          else
            gradle -p apps/api test
          fi

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/main/java apps/api/src/test/java
          if git diff --cached --quiet; then
            echo "No package changes to commit"
            exit 0
          fi
          git commit -m "refactor(api): organize backend by feature layers [package-refactor]"
          git push origin HEAD:refactor/feature-package-architecture
